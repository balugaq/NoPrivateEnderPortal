name: '${name}'
version: '${version}'
main: com.balugaq.noprivateenderportal.NoPrivateEnderPortal
api-version: '1.17'
description: 'Prevents non-exempt players from creating private end portals by placing eyes of ender into end portal frames.'
authors: [balugaq]
commands:
  npe:
    description: 'NoPrivateEnderPortal admin command'
    usage: '/npe reload'
    permission: noprivateenderportal.admin
permissions:
  noprivateenderportal.admin:
    default: op
    description: 'Allows reloading the NoPrivateEnderPortal configuration'
  noprivateenderportal.bypass:
    default: false
    description: 'Bypasses the end portal restriction'
