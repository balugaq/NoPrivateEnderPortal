# ============================================================================
#  NoPrivateEnderPortal 语言文件（zh_CN）
# ============================================================================
# 说明：
#   - config.yml 里的 `language: zh_CN` 决定加载哪个语言文件（对应本目录下的 <language>.yml）。
#   - 插件首次启动时会把内置语言文件原样复制到 plugins/NoPrivateEnderPortal/lang/ 下；
#     之后以磁盘上的文件为准，插件内置的版本只作为缺键兜底，不会被改写。
#   - 颜色代码用 &（如 &a 绿色），占位符用 {0} {1} ...，按 sendMessage/t 传入的参数顺序替换；
#     参数不足时占位符原样保留。
#   - 文本里的单引号、双引号等字符可以直接写，不需要转义。
# ============================================================================

# 非豁免玩家试图往末地传送门框上放末影之眼时的提示
denied: "&c[NoPrivateEnderPortal] 你没有被允许创建末地传送门！"

# /npe reload 成功
reload-done: "&a[NoPrivateEnderPortal] 配置已重载。"

# /npe 参数不正确时的用法提示
usage: "&e用法: /npe reload"
