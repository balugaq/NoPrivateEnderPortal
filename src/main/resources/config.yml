# ============================================================================
#  NoPrivateEnderPortal 配置文件
# ============================================================================
# 语言：zh_CN / en_US（对应 plugins/NoPrivateEnderPortal/lang/<语言>.yml）。
# 首次启动时内置语言文件会复制到磁盘，之后以磁盘文件为准；
# 缺少的键会用内置文件兜底，插件不会改写你的语言文件。
language: zh_CN

# OP 玩家是否豁免。
# true  = OP 可以正常插眼激活传送门（默认，符合「只拦非 OP」的定位）
# false = 连 OP 一起拦（想全服禁传送门时用）
exempt-ops: true

# 赦免玩家列表。支持游戏名（不区分大小写）或 UUID，例如：
# exempt-players:
#   - Balugaq
#   - 069a79f4-44e9-4726-a5be-fca90e38aaf5
# 修改后执行 /npe reload 生效，无需重启服务器。
exempt-players: []

# 提示消息冷却（毫秒）。防止玩家对着门框连续右键时刷屏。
# 0 表示不冷却，每次拦截都发消息。
message-cooldown-ms: 2000
